<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Judge Validation Admin</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --card:#fff; --muted:#667; --line:#dde1e6; --bad:#c62828; --accent:#2f5bea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --fg:#e6e8eb; --card:#1d2025; --muted:#9aa; --line:#32363d; --bad:#ef6b6b; --accent:#7b9bff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; overflow-x:auto; }
  h1 { font-size:1.3rem; } h2 { font-size:1.05rem; margin-top:0; }
  input, button { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:inherit; }
  button { cursor:pointer; } button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .muted { color:var(--muted); } .bad { color:var(--bad); font-weight:600; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Judge validation — admin</h1>
  <div class="card" id="auth">
    <div class="row">
      <input id="tok" type="password" placeholder="Admin token" style="flex:1;min-width:200px">
      <button id="go" class="primary">Sign in</button>
    </div>
    <p id="err" class="bad"></p>
  </div>

  <div id="out" hidden>
    <div class="card">
      <div class="row">
        <span id="totals" class="muted"></span>
        <button id="refresh">Refresh</button>
        <button id="csv">Download CSV</button>
        <label class="muted"><input type="checkbox" id="onlyDis"> only disagreements</label>
      </div>
    </div>
    <div class="card"><h2>Reviewers</h2><table id="rev"></table></div>
    <div class="card"><h2>Sessions</h2><table id="ses"></table></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let token = '';
try { token = sessionStorage.getItem('tok') || ''; } catch {}

async function get(path) {
  const r = await fetch(path, { headers: { 'X-Admin-Token': token } });
  if (!r.ok) throw new Error(r.status === 401 ? 'Wrong token' : r.statusText);
  return r;
}

function fill(table, head, rows) {
  table.replaceChildren();
  const tr = table.insertRow();
  head.forEach(([h, num]) => { const th = document.createElement('th'); th.textContent = h; if (num) th.className = 'n'; tr.append(th); });
  rows.forEach(r => {
    const tr = table.insertRow();
    r.forEach((c, i) => { const td = tr.insertCell(); td.textContent = c.v ?? c; if (head[i][1]) td.className = 'n'; if (c.cls) td.classList.add(c.cls); });
  });
}

async function load() {
  try {
    const s = await (await get('/api/admin/summary')).json();
    $('auth').hidden = true; $('out').hidden = false;
    $('totals').textContent = `${s.total_labels} labels · ${s.reviewers.length} reviewers · ${s.total_sessions} sessions`;
    fill($('rev'), [['Reviewer'], ['Done', 1], ['Jailbreak', 1], ['Not', 1], ['Last active']],
      s.reviewers.map(r => [r.name, `${r.done}/${s.total_sessions}`, r.jailbreak, r.not_jailbreak, new Date(r.last * 1000).toLocaleString()]));
    const only = $('onlyDis').checked;
    fill($('ses'), [['Session'], ['Intent'], ['Jailbreak', 1], ['Not', 1], ['Agreement', 1]],
      s.sessions.filter(x => !only || x.disagreement).map(x => [x.id, x.intent, x.jailbreak, x.not_jailbreak,
        { v: x.agreement == null ? '–' : Math.round(x.agreement * 100) + '%', cls: x.disagreement ? 'bad' : '' }]));
    try { sessionStorage.setItem('tok', token); } catch {}
  } catch (e) { $('auth').hidden = false; $('out').hidden = true; $('err').textContent = e.message; }
}

$('go').onclick = () => { token = $('tok').value; load(); };
$('tok').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('refresh').onclick = load;
$('onlyDis').onchange = load;
$('csv').onclick = async () => {
  const b = await (await get('/api/admin/export.csv')).blob();
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'labels.csv'; a.click();
};
if (token) load();
</script>
</body>
</html>
